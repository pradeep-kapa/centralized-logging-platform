<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#555"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#888"/>
    </marker>
    <marker id="c" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="36" fill="#f0f4f8"/>
  <text x="450" y="23" fill="#1a202c" font-size="14" font-weight="700" text-anchor="middle">Phase 3 — OpenTelemetry Collector (agent + gateway)</text>

  <!-- K8s cluster -->
  <rect x="16" y="50" width="872" height="350" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="30" y="70" fill="#64748b" font-size="11" font-weight="600">Kubernetes cluster</text>

  <!-- Node 1 -->
  <rect x="30" y="80" width="370" height="300" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="44" y="98" fill="#2563eb" font-size="10" font-weight="600">Node 1  (DaemonSet agent)</text>

  <!-- Pods -->
  <rect x="44" y="108" width="158" height="68" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="123" y="133" fill="#0c4a6e" font-size="10" font-weight="700" text-anchor="middle">Pod A</text>
  <text x="123" y="150" fill="#075985" font-size="9.5" text-anchor="middle">app container</text>
  <text x="123" y="165" fill="#075985" font-size="9" text-anchor="middle">stdout / stderr</text>

  <rect x="226" y="108" width="158" height="68" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="305" y="133" fill="#0c4a6e" font-size="10" font-weight="700" text-anchor="middle">Pod B</text>
  <text x="305" y="150" fill="#075985" font-size="9.5" text-anchor="middle">app container</text>
  <text x="305" y="165" fill="#075985" font-size="9" text-anchor="middle">stdout / stderr</text>

  <rect x="44" y="192" width="340" height="22" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="214" y="207" fill="#475569" font-size="9" text-anchor="middle">/var/log/containers  (host path)</text>
  <line x1="123" y1="176" x2="123" y2="192" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="305" y1="176" x2="305" y2="192" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- OTel Agent node 1 -->
  <rect x="68" y="226" width="296" height="100" rx="8" fill="#fff1f0" stroke="#ef4444" stroke-width="2"/>
  <text x="216" y="248" fill="#7f1d1d" font-size="11" font-weight="700" text-anchor="middle">OTel Collector  (agent)</text>
  <text x="216" y="265" fill="#991b1b" font-size="9.5" text-anchor="middle">RECEIVER: filelog  |  /var/log/containers</text>
  <text x="216" y="281" fill="#991b1b" font-size="9.5" text-anchor="middle">PROCESSOR: k8sattributes, batch</text>
  <text x="216" y="297" fill="#991b1b" font-size="9.5" text-anchor="middle">PROCESSOR: resource detection</text>
  <text x="216" y="313" fill="#991b1b" font-size="9.5" text-anchor="middle">EXPORTER: OTLP/gRPC → gateway</text>
  <line x1="214" y1="214" x2="214" y2="226" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Node 2 -->
  <rect x="420" y="80" width="290" height="300" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="434" y="98" fill="#2563eb" font-size="10" font-weight="600">Node 2  (DaemonSet agent)</text>

  <rect x="434" y="108" width="262" height="68" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="565" y="133" fill="#0c4a6e" font-size="10" font-weight="700" text-anchor="middle">Pod C  /  Pod D  /  Pod E</text>
  <text x="565" y="150" fill="#075985" font-size="9.5" text-anchor="middle">app containers  (stdout/stderr)</text>
  <text x="565" y="165" fill="#075985" font-size="9" text-anchor="middle">any number — one agent per node</text>

  <rect x="434" y="192" width="262" height="22" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="565" y="207" fill="#475569" font-size="9" text-anchor="middle">/var/log/containers</text>
  <line x1="565" y1="176" x2="565" y2="192" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>

  <rect x="460" y="226" width="220" height="100" rx="8" fill="#fff1f0" stroke="#ef4444" stroke-width="2"/>
  <text x="570" y="248" fill="#7f1d1d" font-size="10" font-weight="700" text-anchor="middle">OTel Collector (agent)</text>
  <text x="570" y="265" fill="#991b1b" font-size="9.5" text-anchor="middle">filelog receiver</text>
  <text x="570" y="281" fill="#991b1b" font-size="9.5" text-anchor="middle">k8sattributes processor</text>
  <text x="570" y="297" fill="#991b1b" font-size="9.5" text-anchor="middle">kubeletstats receiver</text>
  <text x="570" y="313" fill="#991b1b" font-size="9.5" text-anchor="middle">OTLP → gateway</text>
  <line x1="565" y1="214" x2="565" y2="226" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- OTel Gateway (Deployment) -->
  <rect x="230" y="420" width="440" height="80" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="284" y="440" fill="#4c1d95" font-size="9" font-weight="600">Deployment</text>
  <text x="450" y="453" fill="#4c1d95" font-size="12" font-weight="700" text-anchor="middle">OTel Collector  —  gateway</text>
  <text x="450" y="470" fill="#5b21b6" font-size="9.5" text-anchor="middle">RECEIVER: OTLP/gRPC  |  PROCESSORS: batch, filter, routing</text>
  <text x="450" y="486" fill="#5b21b6" font-size="9.5" text-anchor="middle">EXPORTERS: loki, prometheusremotewrite, (future: otlp/tempo)</text>

  <!-- Agents → Gateway -->
  <line x1="216" y1="326" x2="350" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="326" x2="550" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="370" y="390" fill="#374151" font-size="10" font-weight="600">OTLP / gRPC</text>

  <!-- Backends row -->
  <rect x="30" y="522" width="188" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="124" y="543" fill="#4c1d95" font-size="10" font-weight="700" text-anchor="middle">Grafana Loki</text>
  <text x="124" y="560" fill="#5b21b6" font-size="9" text-anchor="middle">logs  (LogQL)</text>

  <rect x="240" y="522" width="188" height="48" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="334" y="543" fill="#9f1239" font-size="10" font-weight="700" text-anchor="middle">Prometheus</text>
  <text x="334" y="560" fill="#be123c" font-size="9" text-anchor="middle">metrics  (PromQL)</text>

  <rect x="450" y="522" width="188" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="544" y="543" fill="#4c1d95" font-size="10" font-weight="700" text-anchor="middle">Grafana</text>
  <text x="544" y="560" fill="#5b21b6" font-size="9" text-anchor="middle">unified dashboards</text>

  <rect x="660" y="522" width="214" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="767" y="543" fill="#475569" font-size="10" font-weight="700" text-anchor="middle">Future backends</text>
  <text x="767" y="560" fill="#64748b" font-size="9" text-anchor="middle">Tempo / Jaeger / OTLP SaaS</text>

  <!-- Gateway → backends -->
  <line x1="360" y1="500" x2="180" y2="522" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
  <line x1="420" y1="500" x2="334" y2="522" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
  <line x1="490" y1="500" x2="544" y2="522" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
  <line x1="570" y1="500" x2="730" y2="522" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#c)"/>
</svg>
